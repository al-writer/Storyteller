services:
  app:
    build:
      context: .
      target: runtime
    image: storyteller:latest
    ports:
      - "8000:8000"
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      SECRET_SALT: ${SECRET_SALT:-}
      DATA_DIR: /data
    volumes:
      - storyteller-data:/data
    restart: unless-stopped

  tests:
    build:
      context: .
      target: test
    image: storyteller:test
    profiles: ["test"]

volumes:
  storyteller-data:
